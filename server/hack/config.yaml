# CLI tool, only in development environment.
# https://goframe.org/pages/viewpage.action?pageId=3673173
gfcli:
  build:
    name: "hotgo"                          # 编译后的可执行文件名称
    arch: "amd64"                          # 不填默认当前系统架构，可选：386,amd64,arm,all
    system: "linux"                        # 不填默认当前系统平台，可选：linux,darwin,windows,all
    mod: "none"
    cgo: 0
    packSrc: "resource"                    # 将resource目录打包进可执行文件，静态资源无需单独部署
    packDst: "internal/packed/packed.go"   # 打包后生成的Go文件路径，一般使用相对路径指定到本项目目录中
    version: ""
    output: "./temp/hotgo"                 # 可执行文件生成路径
    extra: '-ldflags="-s -w"'              # 去掉符号表和调试信息，二进制约小 25%，上传更快


  docker:
    build: "-a amd64 -s linux -p temp -ew"   # 构建参数
    tagPrefixes:                             # 该docker的标记前缀，用于docker推送，请替换成你自己的
      - ccr.ccs.tencentyun.com/bufanyun


  gen:
    dao:
      - link: "mysql:root:root@tcp(127.0.0.1:3306)/zztest2?loc=Local&parseTime=true&charset=utf8mb4"
#      PostgreSQL 可用连接（默认保持上面的 MySQL，需要时再改成这一行）：
#      - link: "pgsql:postgres:hg123456@tcp(127.0.0.1:5432)/hotgo"
        group: "default"                                                # 分组 使用hotgo代码生成功能时必须填
        tables: "hg_admin_cash,hg_admin_credits_log,hg_admin_dept,hg_admin_member,hg_admin_member_post,hg_admin_member_role,hg_admin_menu,hg_admin_notice,hg_admin_notice_read,hg_admin_oauth,hg_admin_order,hg_admin_post,hg_admin_role,hg_admin_role_casbin,hg_admin_role_menu,hg_pay_log,hg_pay_refund,hg_sys_addons_config,hg_sys_asset_account,hg_sys_asset_log,hg_sys_attachment,hg_sys_blacklist,hg_sys_config,hg_sys_cron,hg_sys_cron_group,hg_sys_dict_data,hg_sys_dict_type,hg_sys_ems_log,hg_sys_gen_codes,hg_sys_log,hg_sys_login_log,hg_sys_provinces,hg_sys_serve_license,hg_sys_serve_log,hg_sys_sms_log" # 底座表名，只生成这些表（插件表在插件内单独生成）
        tablesEx: "hg_sys_addons_install,hg_sys_cache,hg_sys_queue_message" # 排除插件安装记录、缓存表、队列表。这些表不参与业务代码生成。
        removePrefix: "hg_"
        descriptionTag: true
        noModelComment: true
        jsonCase: "CamelLower"
        gJsonSupport: true
        clear: false

      # users
      - link: "mysql:root:root@tcp(127.0.0.1:3306)/zztest2?loc=Local&parseTime=true&charset=utf8mb4"
        group: "default"
        tables: "hg_addon_users_user,hg_addon_users_user_account,hg_addon_users_level,hg_addon_users_tree,hg_addon_users_performance,hg_addon_users_level_log"
        removePrefix: "hg_addon_"
        descriptionTag: true
        noModelComment: true
        jsonCase: "CamelLower"
        gJsonSupport: true
        clear: false
        path: "addons/users"
        daoPath: "model/dao"

      # chain
      - link: "mysql:root:root@tcp(127.0.0.1:3306)/zztest2?loc=Local&parseTime=true&charset=utf8mb4"
        group: "default"
        tables: "hg_addon_chain_config,hg_addon_chain_contract,hg_addon_chain_recharge,hg_addon_chain_withdraw,hg_addon_chain_address"
        removePrefix: "hg_addon_"
        descriptionTag: true
        noModelComment: true
        jsonCase: "CamelLower"
        gJsonSupport: true
        clear: false
        path: "addons/chain"
        daoPath: "model/dao"

      # pledge
      - link: "mysql:root:root@tcp(127.0.0.1:3306)/zztest2?loc=Local&parseTime=true&charset=utf8mb4"
        group: "default"
        tables: "hg_addon_pledge_plan,hg_addon_pledge_period_config,hg_addon_pledge_add_order,hg_addon_pledge_order,hg_addon_pledge_income_log"
        removePrefix: "hg_addon_"
        descriptionTag: true
        noModelComment: true
        jsonCase: "CamelLower"
        gJsonSupport: true
        clear: false
        path: "addons/pledge"
        daoPath: "model/dao"

      # cms
      - link: "mysql:root:root@tcp(127.0.0.1:3306)/zztest2?loc=Local&parseTime=true&charset=utf8mb4"
        group: "default"
        tables: "hg_addon_cms_article"
        removePrefix: "hg_addon_"
        descriptionTag: true
        noModelComment: true
        jsonCase: "CamelLower"
        gJsonSupport: true
        clear: false
        path: "addons/cms"
        daoPath: "model/dao"
        
#    service: # 生成业务配置
#      srcFolder: "internal/logic"
#      dstFolder: "internal/service"
#      dstFileNameCase: "CamelLower"
#      clear: true
    ctrl:
      # api/api下的接口可以使用gf gen ctrl自动生成控制器相关代码
      srcFolder: "api/api"
      dstFolder: "internal/controller/api"
      clear: true
      merge: false
