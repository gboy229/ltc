# HotGo 单机部署示例
#
# 约定：
#   - 后台页面由 Go 内置，当前构建前缀是 /mMe6PXqfRLhjWCiK（web/.env.production 的 VITE_PUBLIC_PATH）
#   - 后台 API 固定 /admin，不随页面路径变化
#   - 页面里的 JS/CSS 也在 /mMe6PXqfRLhjWCiK/assets 下，由 Go 一起提供
#   - 如果要换页面路径：
#       a) 改 VITE_PUBLIC_PATH 并重新打包（页面和资源都搬家）
#       b) 或者只改 nginx：启用下面注释的“另一个入口”，把新路径代理到 /mMe6PXqfRLhjWCiK/index.html
#   - h5 是独立前端（History 路由），放到根路径，nginx 负责 SPA 回退
#
# 使用前替换：server_name、证书路径、/opt/www/h5、[1] 里的 /mMe6PXqfRLhjWCiK

server {
    listen 80;
    server_name example.com;

    # 上传大小与 server.clientMaxBodySize 对齐
    client_max_body_size 200m;

    # ============================================================
    # [1] 后台页面：当前构建前缀 /mMe6PXqfRLhjWCiK
    # ============================================================
    location = /mMe6PXqfRLhjWCiK {
        return 302 /mMe6PXqfRLhjWCiK/;
    }

    location /mMe6PXqfRLhjWCiK/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 可选：不改打包，用另一个入口访问同一个页面
    # location = /secret {
    #     return 302 /secret/;
    # }
    # location = /secret/ {
    #     proxy_pass http://127.0.0.1:8000/mMe6PXqfRLhjWCiK/index.html;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ============================================================
    # [2] 后台 API：固定 /admin
    # ============================================================
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # h5（移动端）
    # ============================================================
    root /opt/www/h5;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------- h5 接口 ----------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------- 首页通道（如用到） ----------------
    location /home/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------- WebSocket ----------------
    location /socket/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
